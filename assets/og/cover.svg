<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cosmic Weekly — Curious science, told slowly.">
  <defs>
    <radialGradient id="bgA" cx="82%" cy="8%" r="70%">
      <stop offset="0" stop-color="#8b7bff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgB" cx="6%" cy="78%" r="62%">
      <stop offset="0" stop-color="#2fd6e8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2fd6e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset=".24" stop-color="#f5b94a"/>
      <stop offset=".62" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#1a1250"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset=".55" stop-color="#2fd6e8"/>
      <stop offset="1" stop-color="#f5b94a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070914"/>
  <rect width="1200" height="630" fill="url(#bgA)"/>
  <rect width="1200" height="630" fill="url(#bgB)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="92" cy="74" r="1.6" opacity=".9"/><circle cx="214" cy="148" r="1" opacity=".7"/>
    <circle cx="352" cy="58" r="1.4" opacity=".8"/><circle cx="470" cy="118" r="1" opacity=".6"/>
    <circle cx="588" cy="40" r="1.8" opacity=".9"/><circle cx="664" cy="196" r="1" opacity=".5"/>
    <circle cx="742" cy="84" r="1.2" opacity=".7"/><circle cx="130" cy="262" r="1.2" opacity=".6"/>
    <circle cx="60" cy="410" r="1.6" opacity=".8"/><circle cx="196" cy="520" r="1" opacity=".6"/>
    <circle cx="410" cy="590" r="1.4" opacity=".7"/><circle cx="520" cy="540" r="1" opacity=".5"/>
    <circle cx="640" cy="598" r="1.2" opacity=".6"/><circle cx="1130" cy="90" r="1.6" opacity=".8"/>
    <circle cx="1060" cy="560" r="1.2" opacity=".6"/><circle cx="880" cy="36" r="1" opacity=".6"/>
  </g>

  <!-- planet + orbit -->
  <g transform="translate(900 318)">
    <circle r="240" fill="none" stroke="#a0afff" stroke-opacity=".22"/>
    <path d="M -240 0 A 240 240 0 0 1 0 -240" fill="none" stroke="#2fd6e8" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="150" fill="url(#planet)"/>
    <circle cx="170" cy="-150" r="9" fill="#2fd6e8"/>
  </g>

  <!-- text -->
  <text x="80" y="92" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="22" letter-spacing="5" fill="#2fd6e8">A WEEKLY MAGAZINE</text>
  <text x="80" y="300" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="-4" fill="#eef0fb">Cosmic</text>
  <text x="80" y="430" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" font-style="italic" letter-spacing="-4" fill="url(#aurora)">Weekly</text>
  <text x="84" y="505" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="32" fill="#b3b9d6">Curious science, told slowly.</text>
  <rect x="84" y="548" width="260" height="4" rx="2" fill="url(#aurora)"/>
</svg>
