<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Articles — Cosmic Weekly</title>
  <meta name="description" content="Browse every Cosmic Weekly story. Search by keyword and filter by topic: cosmos, physics, technology, mind, earth and ideas.">
  <meta name="theme-color" content="#070914">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="canonical" href="https://tanvirpersonal.github.io/cosmic-weekly/articles/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cosmic Weekly">
  <meta property="og:title" content="Articles — Cosmic Weekly">
  <meta property="og:description" content="Browse every story. Search and filter by topic.">
  <meta property="og:url" content="https://tanvirpersonal.github.io/cosmic-weekly/articles/">
  <meta property="og:image" content="https://tanvirpersonal.github.io/cosmic-weekly/assets/og/cover.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove("no-js");
      try {
        var t = localStorage.getItem("cw-theme");
        if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="archive">
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <span class="label label--accent">The archive</span>
        <h1>All stories</h1>
        <p id="archive-lede">Search by keyword or narrow things down by topic.</p>
      </div>

      <div class="archive-toolbar" role="search">
        <div class="archive-toolbar__row">
          <label class="sr-only" for="archive-q">Search articles</label>
          <input class="input" id="archive-q" type="search" placeholder="Search titles, summaries and tags…" autocomplete="off">
          <label class="sr-only" for="archive-sort">Sort articles</label>
          <select class="select" id="archive-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="short">Shortest read</option>
            <option value="long">Longest read</option>
          </select>
        </div>
        <div class="archive-filters" id="archive-filters" role="group" aria-label="Filter by topic"></div>
      </div>

      <p class="label archive-count" id="archive-count" aria-live="polite"></p>
      <div class="grid grid--cards" id="archive-grid"></div>

      <noscript>
        <p class="dim">Cosmic Weekly needs JavaScript to list its stories. Please enable it to continue.</p>
      </noscript>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
