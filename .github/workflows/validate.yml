name: Validate Cosmic Weekly

on:
  push:
    branches: [2.0]
  pull_request:
    branches: [2.0]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check internal links and article references
        run: python3 tools/check_site.py
      - name: Validate JSON data
        run: |
          find data -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done
